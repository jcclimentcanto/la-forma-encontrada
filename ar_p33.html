<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>La Forma Encontrada — AR</title>
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="mindar-image-aframe.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14/build/Tone.js"></script>
<style>
* { margin:0; padding:0; }
#back { position:fixed; top:16px; right:16px; z-index:9999; background:rgba(0,0,0,0.8); border:0.5px solid #333; color:#aaa; font-family:'Courier New',monospace; font-size:9px; letter-spacing:2px; padding:6px 14px; text-decoration:none; }
#hint { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,0.5); font-family:'Courier New',monospace; font-size:9px; letter-spacing:2px; text-align:center; z-index:9999; text-shadow:0 0 8px #000; width:90%; }
#title { position:fixed; top:16px; left:16px; z-index:9999; pointer-events:none; }
#title div:first-child { color:#C04828; font-family:'Courier New',monospace; font-size:11px; letter-spacing:3px; text-shadow:0 0 8px #000; }
#title div:last-child  { color:#aaa; font-family:'Courier New',monospace; font-size:9px; letter-spacing:2px; margin-top:3px; }
</style>
</head>
<body>

<div id="title">
  <div>LA FORMA ENCONTRADA</div>
  <div>AR — PROYECCIÓN</div>
</div>
<a id="back" href="index.html">← MENÚ</a>
<div id="hint">APUNTA A LA PÁGINA 33 DEL LIBRO</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets></a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 1">

    <!-- Triángulo rojo -->
    <a-entity line="start: -0.3 0 -0.17; end: 0.3 0 -0.17; color: #C04828"></a-entity>
    <a-entity line="start: 0.3 0 -0.17; end: 0 0 0.2; color: #C04828"></a-entity>
    <a-entity line="start: 0 0 0.2; end: -0.3 0 -0.17; color: #C04828"></a-entity>

    <!-- Proyección azul -->
    <a-entity line="start: -0.22 -0.08 -0.13; end: 0.22 -0.08 -0.13; color: #185FA5"></a-entity>
    <a-entity line="start: 0.22 -0.08 -0.13; end: 0 -0.08 0.15; color: #185FA5"></a-entity>
    <a-entity line="start: 0 -0.08 0.15; end: -0.22 -0.08 -0.13; color: #185FA5"></a-entity>

    <!-- Conexiones vértices -->
    <a-entity line="start: -0.3 0 -0.17; end: -0.22 -0.08 -0.13; color: #444"></a-entity>
    <a-entity line="start: 0.3 0 -0.17;  end: 0.22 -0.08 -0.13;  color: #444"></a-entity>
    <a-entity line="start: 0 0 0.2;      end: 0 -0.08 0.15;      color: #444"></a-entity>

    <!-- Vértices rojos -->
    <a-sphere radius="0.018" color="#C04828" position="-0.3 0 -0.17" material="emissive:#C04828;emissiveIntensity:0.8"></a-sphere>
    <a-sphere radius="0.018" color="#C04828" position="0.3 0 -0.17"  material="emissive:#C04828;emissiveIntensity:0.8"></a-sphere>
    <a-sphere radius="0.018" color="#C04828" position="0 0 0.2"      material="emissive:#C04828;emissiveIntensity:0.8"></a-sphere>

    <!-- Vértices azules proyección -->
    <a-sphere radius="0.012" color="#185FA5" position="-0.22 -0.08 -0.13" material="emissive:#185FA5;emissiveIntensity:0.6"></a-sphere>
    <a-sphere radius="0.012" color="#185FA5" position="0.22 -0.08 -0.13"  material="emissive:#185FA5;emissiveIntensity:0.6"></a-sphere>
    <a-sphere radius="0.012" color="#185FA5" position="0 -0.08 0.15"      material="emissive:#185FA5;emissiveIntensity:0.6"></a-sphere>

    <!-- Anillos concéntricos -->
    <a-torus radius="0.10" radius-tubular="0.003" color="#185FA5" rotation="90 0 0"
      material="transparent:true;opacity:0.5;emissive:#185FA5;emissiveIntensity:0.5"
      animation="property:scale;to:1.15 1.15 1.15;dir:alternate;loop:true;dur:1200;easing:easeInOutSine"></a-torus>
    <a-torus radius="0.18" radius-tubular="0.003" color="#185FA5" rotation="90 0 0"
      material="transparent:true;opacity:0.35;emissive:#185FA5;emissiveIntensity:0.4"
      animation="property:scale;to:1.12 1.12 1.12;dir:alternate;loop:true;dur:1600;easing:easeInOutSine"></a-torus>
    <a-torus radius="0.26" radius-tubular="0.002" color="#185FA5" rotation="90 0 0"
      material="transparent:true;opacity:0.22;emissive:#185FA5;emissiveIntensity:0.3"
      animation="property:scale;to:1.10 1.10 1.10;dir:alternate;loop:true;dur:2000;easing:easeInOutSine"></a-torus>
    <a-torus radius="0.34" radius-tubular="0.002" color="#185FA5" rotation="90 0 0"
      material="transparent:true;opacity:0.12;emissive:#185FA5;emissiveIntensity:0.2"
      animation="property:scale;to:1.08 1.08 1.08;dir:alternate;loop:true;dur:2400;easing:easeInOutSine"></a-torus>

    <!-- Partículas flotantes -->
    <a-sphere radius="0.007" color="#fff" position="-0.28 0.04 -0.14" material="transparent:true;opacity:0.9;emissive:#fff;emissiveIntensity:0.5" animation="property:position;to:-0.20 0.10 -0.08;dir:alternate;loop:true;dur:1800"></a-sphere>
    <a-sphere radius="0.005" color="#C04828" position="0.28 0.03 -0.14" material="transparent:true;opacity:0.9;emissive:#C04828;emissiveIntensity:0.6" animation="property:position;to:0.20 0.09 -0.08;dir:alternate;loop:true;dur:2200"></a-sphere>
    <a-sphere radius="0.006" color="#fff" position="0 0.06 0.18" material="transparent:true;opacity:0.8;emissive:#fff;emissiveIntensity:0.5" animation="property:position;to:0.05 0.12 0.11;dir:alternate;loop:true;dur:1500"></a-sphere>
    <a-sphere radius="0.005" color="#fff" position="-0.14 0.02 0.03" material="transparent:true;opacity:0.6" animation="property:position;to:-0.07 0.08 0.06;dir:alternate;loop:true;dur:2800"></a-sphere>
    <a-sphere radius="0.007" color="#185FA5" position="0.14 0.03 0.01" material="transparent:true;opacity:0.7;emissive:#185FA5;emissiveIntensity:0.5" animation="property:position;to:0.07 0.09 0.05;dir:alternate;loop:true;dur:2100"></a-sphere>
    <a-sphere radius="0.004" color="#fff" position="0.06 0.02 -0.12" material="transparent:true;opacity:0.5" animation="property:position;to:0.11 0.07 -0.07;dir:alternate;loop:true;dur:1900"></a-sphere>
    <a-sphere radius="0.006" color="#C04828" position="-0.06 0.04 0.09" material="transparent:true;opacity:0.8;emissive:#C04828;emissiveIntensity:0.4" animation="property:position;to:-0.11 0.10 0.04;dir:alternate;loop:true;dur:2500"></a-sphere>

  </a-entity>
</a-scene>

<script>
document.querySelector('[mindar-image-target]').addEventListener('targetFound', () => {
  document.getElementById('hint').textContent = '✓ PÁGINA 33 DETECTADA';
  startAudio();
});
document.querySelector('[mindar-image-target]').addEventListener('targetLost', () => {
  document.getElementById('hint').textContent = 'APUNTA A LA PÁGINA 33 DEL LIBRO';
});

let audioReady = false;
async function startAudio() {
  if (audioReady) return;
  try {
    await Tone.start();
    const rev = new Tone.Reverb({ decay: 7, wet: 0.7 }).toDestination();
    const synth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'sine' },
      envelope: { attack: 3, sustain: 1, release: 6 }
    }).connect(rev);
    synth.volume.value = -20;
    synth.triggerAttack(['A1', 'E2']);
    audioReady = true;
  } catch(e) {}
}
</script>
</body>
</html>
