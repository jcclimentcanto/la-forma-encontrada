<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>La Forma Encontrada — AR Proyección</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Courier New',monospace; }

#splash {
  position:fixed; inset:0; background:#000; z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px;
}
.s-title { color:#C04828; font-size:16px; letter-spacing:4px; margin-bottom:6px; text-align:center; }
.s-sub   { color:#333; font-size:9px; letter-spacing:3px; margin-bottom:40px; text-align:center; }
.s-btn {
  background:transparent; border:1px solid #C04828; color:#C04828;
  font-family:'Courier New',monospace; font-size:11px; letter-spacing:3px;
  padding:14px 0; cursor:pointer; width:260px; margin-bottom:12px;
}
.s-back {
  border:1px solid #222; color:#333; text-decoration:none;
  text-align:center; display:block; padding:10px 0; width:260px;
  font-size:10px; letter-spacing:2px; font-family:'Courier New',monospace;
}
.s-note { color:#222; font-size:8px; letter-spacing:1px; text-align:center; margin-top:24px; line-height:2; }

#ui {
  position:fixed; top:0; left:0; right:0; z-index:999; pointer-events:none;
  display:none; justify-content:space-between; align-items:flex-start; padding:16px 20px;
}
.htitle { color:#C04828; font-size:11px; letter-spacing:3px; text-shadow:0 0 8px #000; }
.hmode  { color:#aaa; font-size:9px; letter-spacing:2px; margin-top:4px; }
.back {
  pointer-events:all; background:rgba(0,0,0,0.8); border:0.5px solid #333;
  color:#aaa; font-family:'Courier New',monospace; font-size:9px;
  letter-spacing:2px; padding:6px 14px; text-decoration:none;
}
#hint {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,0.6); font-size:9px; letter-spacing:2px;
  text-align:center; z-index:999; width:90%; display:none;
  text-shadow:0 0 8px #000;
}
</style>
</head>
<body>

<div id="splash">
  <div class="s-title">LA FORMA ENCONTRADA</div>
  <div class="s-sub">AR — PROYECCIÓN</div>
  <button class="s-btn" id="startBtn">▶ ACTIVAR CÁMARA AR</button>
  <a class="s-back" href="index.html">← VOLVER AL MENÚ</a>
  <div class="s-note" id="note">
    Acepta el permiso de cámara cuando aparezca.<br>
    Después apunta a la página 33 del libro.
  </div>
</div>

<div id="ui">
  <div>
    <div class="htitle">LA FORMA ENCONTRADA</div>
    <div class="hmode">AR — PROYECCIÓN</div>
  </div>
  <a class="back" href="index.html">← MENÚ</a>
</div>
<div id="hint">APUNTA A LA PÁGINA 33 DEL LIBRO</div>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="mindar-image-aframe.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14/build/Tone.js"></script>

<script>
// Componente personalizado — sistema de partículas + triángulo 3D
AFRAME.registerComponent('forma-encontrada', {
  init: function() {
    const el = this.el;
    const scene = this.el.sceneEl;
    this.frame = 0;
    this.particles = [];

    // Triángulo rojo
    const triRed = document.createElement('a-entity');
    triRed.setAttribute('id', 'tri-red');
    el.appendChild(triRed);

    // Crear líneas del triángulo rojo
    for (let i = 0; i < 3; i++) {
      const a1 = Math.PI * (-0.5 + i * 2/3);
      const a2 = Math.PI * (-0.5 + ((i+1)%3) * 2/3);
      const r = 0.35;
      const line = document.createElement('a-entity');
      line.setAttribute('line', {
        start: {x: r*Math.cos(a1), y: 0, z: r*Math.sin(a1)},
        end:   {x: r*Math.cos(a2), y: 0, z: r*Math.sin(a2)},
        color: '#C04828'
      });
      el.appendChild(line);
    }

    // Proyección azul — triángulo desplazado
    for (let i = 0; i < 3; i++) {
      const a1 = Math.PI * (-0.5 + i * 2/3);
      const a2 = Math.PI * (-0.5 + ((i+1)%3) * 2/3);
      const r = 0.27; const ox = 0.08; const oy = -0.08;
      const line = document.createElement('a-entity');
      line.setAttribute('line', {
        start: {x: r*Math.cos(a1)+ox, y: oy, z: r*Math.sin(a1)},
        end:   {x: r*Math.cos(a2)+ox, y: oy, z: r*Math.sin(a2)},
        color: '#185FA5'
      });
      el.appendChild(line);
    }

    // Vértices como esferas
    for (let i = 0; i < 3; i++) {
      const a = Math.PI * (-0.5 + i * 2/3);
      const sphere = document.createElement('a-sphere');
      sphere.setAttribute('radius', 0.018);
      sphere.setAttribute('color', '#C04828');
      sphere.setAttribute('position', `${0.35*Math.cos(a)} 0 ${0.35*Math.sin(a)}`);
      sphere.setAttribute('material', 'emissive: #C04828; emissiveIntensity: 0.5');
      el.appendChild(sphere);
    }

    // Anillos concéntricos que pulsan
    this.rings = [];
    for (let r = 0.08; r < 0.45; r += 0.09) {
      const ring = document.createElement('a-torus');
      ring.setAttribute('radius', r);
      ring.setAttribute('radius-tubular', 0.003);
      ring.setAttribute('color', '#185FA5');
      ring.setAttribute('material', 'transparent: true; opacity: 0.3; emissive: #185FA5; emissiveIntensity: 0.3');
      ring.setAttribute('rotation', '90 0 0');
      el.appendChild(ring);
      this.rings.push(ring);
    }

    // Partículas como esferas pequeñas
    for (let i = 0; i < 60; i++) {
      const v = Math.floor(Math.random() * 3);
      const a = Math.PI * (-0.5 + v * 2/3);
      const p = document.createElement('a-sphere');
      p.setAttribute('radius', 0.006 + Math.random() * 0.006);
      p.setAttribute('color', Math.random() > 0.4 ? '#ffffff' : '#C04828');
      p.setAttribute('material', 'transparent: true; opacity: 0.8; emissive: #ffffff; emissiveIntensity: 0.3');
      const px = 0.35*Math.cos(a) + (Math.random()-0.5)*0.08;
      const py = (Math.random()-0.5)*0.08;
      const pz = 0.35*Math.sin(a) + (Math.random()-0.5)*0.08;
      p.setAttribute('position', `${px} ${py} ${pz}`);
      el.appendChild(p);
      this.particles.push({
        el: p,
        ox: px, oy: py, oz: pz,
        vx: (Math.random()-0.5)*0.004,
        vy: (Math.random()-0.5)*0.004,
        vz: (Math.random()-0.5)*0.004,
        life: Math.random(),
        max: 0.6 + Math.random() * 0.6,
        vertex: v
      });
    }

    // Ondas de fondo — plano con wireframe
    const plane = document.createElement('a-plane');
    plane.setAttribute('width', 0.8);
    plane.setAttribute('height', 0.8);
    plane.setAttribute('color', '#C04828');
    plane.setAttribute('material', 'wireframe: true; opacity: 0.08; transparent: true');
    plane.setAttribute('rotation', '-90 0 0');
    plane.setAttribute('position', '0 -0.01 0');
    el.appendChild(plane);

    // Detectar cuando se ve el target
    el.addEventListener('targetFound', () => {
      document.getElementById('hint').textContent = '✓ PÁGINA 33 DETECTADA';
      startAudio();
    });
    el.addEventListener('targetLost', () => {
      document.getElementById('hint').textContent = 'APUNTA A LA PÁGINA 33 DEL LIBRO';
    });
  },

  tick: function() {
    this.frame++;
    const f = this.frame;

    // Anillos pulsan
    this.rings.forEach((ring, i) => {
      const s = 1 + Math.sin(f * 0.04 + i * 0.6) * 0.12;
      ring.setAttribute('scale', `${s} ${s} ${s}`);
      const op = 0.15 + Math.sin(f * 0.05 + i * 0.8) * 0.1;
      ring.setAttribute('material', `transparent: true; opacity: ${op}; emissive: #185FA5; emissiveIntensity: 0.3`);
    });

    // Partículas se mueven
    this.particles.forEach(p => {
      p.life += 0.008;
      if (p.life > p.max) {
        const a = Math.PI * (-0.5 + p.vertex * 2/3);
        p.ox = 0.35*Math.cos(a) + (Math.random()-0.5)*0.06;
        p.oy = (Math.random()-0.5)*0.06;
        p.oz = 0.35*Math.sin(a) + (Math.random()-0.5)*0.06;
        p.vx = (Math.random()-0.5)*0.004;
        p.vy = (Math.random()-0.5)*0.004;
        p.vz = (Math.random()-0.5)*0.004;
        p.life = 0;
      }
      p.ox += p.vx; p.oy += p.vy; p.oz += p.vz;
      p.el.setAttribute('position', `${p.ox} ${p.oy} ${p.oz}`);
      const op = 0.4 + Math.sin(f * 0.1 + p.life * 10) * 0.4;
      p.el.setAttribute('material', `transparent: true; opacity: ${Math.max(0,op)}; emissive: #ffffff; emissiveIntensity: 0.2`);
    });

    // Rotación lenta del grupo
    this.el.setAttribute('rotation', `0 ${f * 0.3} 0`);
  }
});

// ── AUDIO ──
let audioReady = false;
async function startAudio() {
  if (audioReady) return;
  try {
    await Tone.start();
    const rev = new Tone.Reverb({ decay: 7, wet: 0.7 }).toDestination();
    const synth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'sine' },
      envelope: { attack: 3, sustain: 1, release: 6 }
    }).connect(rev);
    synth.volume.value = -20;
    synth.triggerAttack(['A1', 'E2']);
    audioReady = true;
  } catch(e) {}
}

// ── INICIO ──
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('splash').style.display = 'none';
  document.getElementById('ui').style.display = 'flex';
  document.getElementById('hint').style.display = 'block';

  const scene = document.createElement('a-scene');
  scene.setAttribute('mindar-image', `
    imageTargetSrc: targets.mind;
    autoStart: true;
    uiLoading: no;
    uiError: no;
    uiScanning: no;
  `);
  scene.setAttribute('color-space', 'sRGB');
  scene.setAttribute('renderer', 'colorManagement: true; physicallyCorrectLights: true');
  scene.setAttribute('vr-mode-ui', 'enabled: false');
  scene.setAttribute('device-orientation-permission-ui', 'enabled: false');

  const assets = document.createElement('a-assets');
  scene.appendChild(assets);

  const camera = document.createElement('a-camera');
  camera.setAttribute('position', '0 0 0');
  camera.setAttribute('look-controls', 'enabled: false');
  scene.appendChild(camera);

  // Target 1 — página 33
  const target = document.createElement('a-entity');
  target.setAttribute('mindar-image-target', 'targetIndex: 1');

  const content = document.createElement('a-entity');
  content.setAttribute('forma-encontrada', '');
  target.appendChild(content);
  scene.appendChild(target);

  document.body.appendChild(scene);
});
</script>
</body>
</html>
