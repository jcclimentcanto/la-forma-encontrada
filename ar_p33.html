<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>La Forma Encontrada — AR</title>
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="mindar-image-aframe.prod.js"></script>
<style>
* { margin:0; padding:0; }
#log { position:fixed; top:60px; left:10px; right:10px; z-index:9999; color:#4CAF50; font-family:'Courier New',monospace; font-size:9px; line-height:1.8; pointer-events:none; }
#back { position:fixed; top:16px; right:16px; z-index:9999; background:rgba(0,0,0,0.8); border:0.5px solid #333; color:#aaa; font-family:'Courier New',monospace; font-size:9px; letter-spacing:2px; padding:6px 14px; text-decoration:none; }
</style>
</head>
<body>

<a id="back" href="index.html">← MENÚ</a>
<div id="log">INICIANDO...</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets></a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 1">
    <a-box color="#C04828" scale="0.2 0.2 0.2"
      animation="property:rotation;to:0 360 0;loop:true;dur:2000"></a-box>
  </a-entity>

</a-scene>

<script>
const log = document.getElementById('log');
function addLog(msg) {
  log.innerHTML += '<br>' + msg;
  console.log(msg);
}

const scene = document.querySelector('a-scene');
scene.addEventListener('loaded', () => addLog('✓ SCENE LOADED'));
scene.addEventListener('renderstart', () => addLog('✓ RENDER START'));

// MindAR events
scene.addEventListener('arReady', () => addLog('✓ AR READY — APUNTA AL LIBRO'));
scene.addEventListener('arError', (e) => addLog('✗ AR ERROR: ' + JSON.stringify(e.detail)));

// Override console.error para capturar errores
const origError = console.error;
console.error = (...args) => {
  addLog('ERROR: ' + args.join(' '));
  origError(...args);
};
const origWarn = console.warn;
console.warn = (...args) => {
  addLog('WARN: ' + args.join(' '));
  origWarn(...args);
};

document.querySelector('[mindar-image-target]').addEventListener('targetFound', () => addLog('✓ TARGET 1 FOUND!'));
document.querySelector('[mindar-image-target]').addEventListener('targetLost',  () => addLog('TARGET LOST'));
</script>
</body>
</html>
