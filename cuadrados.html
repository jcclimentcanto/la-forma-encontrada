<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Forma Encontrada — CUADRADOS</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Courier New',monospace; }
canvas { position:fixed; inset:0; width:100%; height:100%; }
video { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
#ui { position:fixed; inset:0; pointer-events:none; }
.htitle { position:absolute; top:16px; left:20px; color:#C04828; font-size:11px; letter-spacing:3px; }
.hmode { position:absolute; top:33px; left:20px; color:#222; font-size:9px; letter-spacing:3px; }
#status { position:absolute; top:16px; right:160px; color:#333; font-size:9px; letter-spacing:2px; }
.back { position:absolute; top:14px; right:20px; pointer-events:all; background:transparent; border:0.5px solid #181816; color:#333; font-family:'Courier New',monospace; font-size:9px; letter-spacing:2px; padding:6px 14px; cursor:pointer; text-decoration:none; transition:all 0.3s; }
.back:hover { border-color:#C04828; color:#C04828; }
#legend { position:absolute; top:50%; right:20px; transform:translateY(-50%); display:flex; flex-direction:column; gap:12px; width:115px; }
.leg { display:flex; flex-direction:column; align-items:center; gap:3px; opacity:0.2; transition:opacity 0.3s; }
.leg.active { opacity:1; }
.leg svg { width:44px; height:44px; }
.ltxt { color:#666; font-size:7px; letter-spacing:1.5px; text-align:center; line-height:1.6; }
.lact { color:#C04828; font-size:7px; letter-spacing:1px; text-align:center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="video" autoplay playsinline muted></video>
<div id="ui">
  <div class="htitle">LA FORMA ENCONTRADA</div>
  <div class="hmode">CUADRADOS</div>
  <div id="status"></div>
  <a class="back" href="index.html">← MENÚ</a>
  
  <div id="legend">
    <div class="leg active" id="leg-open">
      <svg viewBox="0 0 44 44" fill="none"><g stroke="#fff" stroke-width="1.3" stroke-linecap="round"><line x1="22" y1="38" x2="22" y2="8"/><line x1="17" y1="38" x2="17" y2="11"/><line x1="27" y1="38" x2="27" y2="11"/><line x1="12" y1="38" x2="12" y2="16"/><line x1="32" y1="38" x2="32" y2="16"/><path d="M9 38 Q22 42 35 38"/></g></svg>
      <div class="ltxt">MANO ABIERTA</div><div class="lact">EXPANDE</div>
    </div>
    <div class="leg" id="leg-fist">
      <svg viewBox="0 0 44 44" fill="none"><g stroke="#fff" stroke-width="1.3" stroke-linecap="round"><rect x="11" y="23" width="22" height="13" rx="4"/><rect x="13" y="16" width="18" height="9" rx="3"/><path d="M11 27 Q8 27 8 31 Q8 35 11 35"/></g></svg>
      <div class="ltxt">PUÑO CERRADO</div><div class="lact">CONTRAE</div>
    </div>
    <div class="leg" id="leg-pinch">
      <svg viewBox="0 0 44 44" fill="none"><g stroke="#fff" stroke-width="1.3" stroke-linecap="round"><circle cx="22" cy="22" r="5"/><line x1="17" y1="17" x2="10" y2="10"/><line x1="27" y1="17" x2="34" y2="10"/><line x1="27" y1="27" x2="34" y2="34"/><line x1="17" y1="27" x2="10" y2="34"/></g></svg>
      <div class="ltxt">PELLIZCO</div><div class="lact">RESET</div>
    </div>
    <div class="leg" id="leg-swipe">
      <svg viewBox="0 0 44 44" fill="none"><g stroke="#fff" stroke-width="1.3" stroke-linecap="round"><line x1="22" y1="36" x2="22" y2="12"/><line x1="17" y1="36" x2="17" y2="15"/><line x1="27" y1="36" x2="27" y2="15"/><path d="M14 36 Q22 40 30 36"/><line x1="4" y1="22" x2="40" y2="22" stroke-dasharray="3,2"/><polyline points="34,17 40,22 34,27"/></g></svg>
      <div class="ltxt">BARRIDO LATERAL</div><div class="lact">MAREA</div>
    </div>
    <div class="leg" id="leg-hands2">
      <svg viewBox="0 0 44 44" fill="none"><g stroke="#fff" stroke-width="1.3" stroke-linecap="round"><line x1="4" y1="22" x2="40" y2="22"/><line x1="4" y1="17" x2="4" y2="27"/><line x1="40" y1="17" x2="40" y2="27"/><line x1="14" y1="16" x2="14" y2="10"/><line x1="19" y1="16" x2="19" y2="8"/><line x1="24" y1="16" x2="24" y2="10"/><path d="M11 28 Q19 32 27 28"/></g></svg>
      <div class="ltxt">DOS MANOS</div><div class="lact">DENSIDAD</div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>window.MODE='cuadrados';</script>
<script>
let W, H, frame=0;
let mx, my, pmx, pmy;
let expandFactor=1.0, densityFactor=1.0;
let particles=[], anchors=[];
let swipeActive=false, vhx=0, vhy=0;
let canvas, ctx;

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  mx=W/2; my=H/2; pmx=W/2; pmy=H/2;
  buildAnchors();
  if(particles.length) resetParticles();
}

function buildAnchors(){
  const cx=W/2, cy=H/2, r=Math.min(W,H)*0.36*expandFactor;
  anchors=[];
  const M=window.MODE||'triangulo';
  if(M==='triangulo'){
    for(let i=0;i<3;i++){const a=Math.PI*(-.5+i*2/3);anchors.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}
  } else if(M==='concentricas'||M==='parabolas'){
    anchors.push([cx,cy]);
  } else if(M==='cuadrados'){
    const s=r*0.9;
    anchors.push([cx-s,cy-s],[cx+s,cy-s],[cx+s,cy+s],[cx-s,cy+s]);
  } else {
    anchors.push([cx,cy]);
  }
}

function drawReference(){
  const M=window.MODE||'triangulo';
  const cx=W/2, cy=H/2, r=Math.min(W,H)*0.36*expandFactor;
  ctx.save();
  if(M==='triangulo'&&anchors.length===3){
    ctx.strokeStyle='rgba(192,72,40,0.15)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(anchors[0][0],anchors[0][1]);
    anchors.forEach(([x,y])=>ctx.lineTo(x,y));ctx.closePath();ctx.stroke();
    const ox=r*0.12,oy=r*0.11;
    ctx.setLineDash([6,4]);ctx.strokeStyle='rgba(24,95,165,0.1)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(anchors[0][0]+ox,anchors[0][1]+oy);
    anchors.forEach(([x,y])=>ctx.lineTo(x+ox,y+oy));ctx.closePath();ctx.stroke();ctx.setLineDash([]);
    anchors.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle='rgba(192,72,40,0.4)';ctx.fill();});
  } else if(M==='waves'){
    for(let i=0;i<6;i++){
      const yb=H*(0.15+i*0.14);
      ctx.strokeStyle=`rgba(255,255,255,${0.05-i*0.007})`;ctx.lineWidth=1;
      ctx.beginPath();
      for(let x=0;x<=W;x+=6){const y=yb+28*Math.sin(x*0.008+frame*0.004+i*0.8);x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
      ctx.stroke();
    }
  } else if(M==='poligonos'){
    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=0.8;
    const cols=16,rows=10,j=30;const nodes={};
    for(let row=0;row<=rows;row++)for(let col=0;col<=cols;col++)nodes[`${col},${row}`]=[col*W/cols+Math.sin(col*7+row*3)*j,row*H/rows+Math.cos(col*3+row*7)*j];
    for(let row=0;row<=rows;row++)for(let col=0;col<cols;col++){const[x1,y1]=nodes[`${col},${row}`],[x2,y2]=nodes[`${col+1},${row}`];ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
    for(let col=0;col<=cols;col++)for(let row=0;row<rows;row++){const[x1,y1]=nodes[`${col},${row}`],[x2,y2]=nodes[`${col},${row+1}`];ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
  } else if(M==='estructuras'){
    let rngS=42;const rng=()=>{rngS=(rngS*16807)%2147483647;return(rngS-1)/2147483646;};
    function subdiv(x1,y1,x2,y2,d){
      if(d===0||(x2-x1)<40||(y2-y1)<40)return;
      ctx.strokeStyle=`rgba(255,255,255,${0.04+d*0.01})`;ctx.lineWidth=d*0.3;
      ctx.strokeRect(x1,y1,x2-x1,y2-y1);
      if(rng()>0.4){if((x2-x1)>(y2-y1)){const s=x1+(x2-x1)*(0.3+rng()*0.4);subdiv(x1,y1,s,y2,d-1);subdiv(s,y1,x2,y2,d-1);}
      else{const s=y1+(y2-y1)*(0.3+rng()*0.4);subdiv(x1,y1,x2,s,d-1);subdiv(x1,s,x2,y2,d-1);}}
    }
    subdiv(20,20,W-20,H-20,6);
  } else if(M==='concentricas'){
    for(let rr=20;rr<Math.max(W,H);rr+=Math.min(W,H)*0.06){
      ctx.strokeStyle=`rgba(255,255,255,${Math.max(0.02,0.07-rr/Math.max(W,H)*0.3)})`;ctx.lineWidth=0.8;
      ctx.beginPath();ctx.ellipse(cx,cy,rr,rr*0.85,0,0,Math.PI*2);ctx.stroke();
    }
  } else if(M==='parabolas'){
    for(let i=0;i<12;i++){
      const vx=W*(0.15+i*0.07),vy=H*0.7,a=0.0004+i*0.0001;
      ctx.strokeStyle=`rgba(255,255,255,${0.04+i*0.003})`;ctx.lineWidth=0.8;
      ctx.beginPath();let started=false;
      for(let x=0;x<=W;x+=4){const y=vy+a*(x-vx)**2;if(y>=0&&y<=H){started?ctx.lineTo(x,y):ctx.moveTo(x,y);started=true;}else started=false;}
      ctx.stroke();
    }
  } else if(M==='diagonales'){
    const step=Math.min(W,H)*0.12;
    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=0.8;
    for(let i=-H;i<W;i+=step){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H,H);ctx.stroke();ctx.beginPath();ctx.moveTo(i+H,0);ctx.lineTo(i,H);ctx.stroke();}
  } else if(M==='cuadrados'){
    const step=Math.min(W,H)*0.13;
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=0.8;
    for(let x=0;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  }
  ctx.restore();
}

class P {
  constructor(){this.reset();}
  reset(){
    const M=window.MODE||'triangulo';
    const cx=W/2,cy=H/2,r=Math.min(W,H)*0.36*expandFactor;
    if(M==='triangulo'&&anchors.length===3){
      const e=Math.floor(Math.random()*3),t=Math.random();
      const a=anchors[e],b=anchors[(e+1)%3];
      this.x=a[0]+(b[0]-a[0])*t+(Math.random()-.5)*10;
      this.y=a[1]+(b[1]-a[1])*t+(Math.random()-.5)*10;
      const dx=this.x-cx,dy=this.y-cy,d=Math.sqrt(dx*dx+dy*dy)||1;
      this.vx=dx/d*-.3+(Math.random()-.5)*.5;this.vy=dy/d*-.3+(Math.random()-.5)*.5;
    } else if(M==='waves'){
      this.x=Math.random()*W;this.y=H*(0.1+Math.random()*0.8);
      this.vx=(Math.random()-.5)*.4;this.vy=(Math.random()-.5)*.2;
    } else if(M==='concentricas'){
      const a=Math.random()*Math.PI*2,rad=20+Math.random()*r;
      this.x=cx+Math.cos(a)*rad;this.y=cy+Math.sin(a)*rad;
      const p=a+Math.PI/2,sp=.4+Math.random()*1.2;
      this.vx=Math.cos(p)*sp;this.vy=Math.sin(p)*sp;
    } else if(M==='parabolas'){
      this.x=Math.random()*W;
      const vx=W/2,a=0.0005;
      this.y=Math.max(0,Math.min(H,H*0.7+a*(this.x-vx)**2));
      this.vx=(Math.random()-.5)*.3;this.vy=-Math.random()*.8;
    } else if(M==='diagonales'){
      const side=Math.floor(Math.random()*4);
      if(side===0){this.x=Math.random()*W;this.y=0;this.vx=.5+Math.random();this.vy=.5+Math.random();}
      else if(side===1){this.x=W;this.y=Math.random()*H;this.vx=-.5-Math.random();this.vy=.5+Math.random();}
      else if(side===2){this.x=Math.random()*W;this.y=H;this.vx=.5+Math.random();this.vy=-.5-Math.random();}
      else{this.x=0;this.y=Math.random()*H;this.vx=.5+Math.random();this.vy=-.5-Math.random();}
    } else {
      this.x=Math.random()*W;this.y=Math.random()*H;
      this.vx=(Math.random()-.5)*.6;this.vy=(Math.random()-.5)*.6;
    }
    this.life=Math.random()*260+80;this.maxLife=this.life;
    this.sz=Math.random()*2+.3;this.trail=[];this.svx=0;this.svy=0;
  }
  update(){
    const M=window.MODE||'triangulo';
    const cx=W/2,cy=H/2;
    this.trail.push([this.x,this.y]);
    if(this.trail.length>16)this.trail.shift();
    if(swipeActive){
      const dx=this.x-mx,dy=this.y-my,d=Math.sqrt(dx*dx+dy*dy)+1;
      const inf=Math.max(0,1-d/320)**2;
      this.svx+=vhx*inf*.45;this.svy+=vhy*inf*.12;
    }
    this.svx*=.90;this.svy*=.90;
    if(M==='triangulo'&&anchors.length===3){
      let fx=0,fy=0;
      anchors.forEach(([tx,ty])=>{const dx=tx-this.x,dy=ty-this.y,d=Math.sqrt(dx*dx+dy*dy)+1;fx+=dx/d*.022;fy+=dy/d*.022;});
      if(!swipeActive){const mdx=this.x-mx,mdy=this.y-my,md=Math.sqrt(mdx*mdx+mdy*mdy)+1;if(md<140){fx+=mdx/md*.75;fy+=mdy/md*.75;}}
      this.vx+=fx;this.vy+=fy;
    } else if(M==='waves'){
      const nx=this.x/W*5,ny=this.y/H*5;
      const ang=(Math.sin(nx+frame*.007)*Math.cos(ny+frame*.005))*Math.PI*2;
      this.vx+=Math.cos(ang)*.05;this.vy+=Math.sin(ang)*.04;
      if(!swipeActive){const mdx=this.x-mx,mdy=this.y-my,md=Math.sqrt(mdx*mdx+mdy*mdy)+1;if(md<160){this.vx+=mdx/md*.7;this.vy+=mdy/md*.7;}}
    } else if(M==='concentricas'){
      const dx=cx-this.x,dy=cy-this.y,d=Math.sqrt(dx*dx+dy*dy)+1;
      this.vx+=dx/d*.06;this.vy+=dy/d*.06;
      this.vx+=-dy/d*.12;this.vy+=dx/d*.12;
    } else if(M==='parabolas'){
      const nx=this.x/W*4;
      const ang=Math.sin(nx+frame*.005)*Math.PI*.5;
      this.vx+=Math.cos(ang)*.04;this.vy+=Math.sin(ang)*.04;
      if(!swipeActive){const mdx=this.x-mx,mdy=this.y-my,md=Math.sqrt(mdx*mdx+mdy*mdy)+1;if(md<140){this.vx+=mdx/md*.6;this.vy+=mdy/md*.6;}}
    } else if(M==='diagonales'){
      if(!swipeActive){const mdx=this.x-mx,mdy=this.y-my,md=Math.sqrt(mdx*mdx+mdy*mdy)+1;if(md<150){this.vx+=mdx/md*.65;this.vy+=mdy/md*.65;}}
    } else {
      const nx=this.x/W*4,ny=this.y/H*4;
      const ang=(Math.sin(nx+frame*.006)*Math.cos(ny+frame*.004))*Math.PI*2;
      this.vx+=Math.cos(ang)*.04;this.vy+=Math.sin(ang)*.04;
      if(!swipeActive){const mdx=this.x-mx,mdy=this.y-my,md=Math.sqrt(mdx*mdx+mdy*mdy)+1;if(md<140){this.vx+=mdx/md*.65;this.vy+=mdy/md*.65;}}
    }
    this.vx+=this.svx*.09;this.vy+=this.svy*.09;
    const sp=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
    if(sp>3.5){this.vx=this.vx/sp*3.5;this.vy=this.vy/sp*3.5;}
    this.vx*=.97;this.vy*=.97;
    this.x+=this.vx;this.y+=this.vy;
    this.life--;
    if(this.life<=0||this.x<-50||this.x>W+50||this.y<-50||this.y>H+50)this.reset();
  }
  draw(){
    const a=this.life/this.maxLife;
    if(this.trail.length>2){
      ctx.beginPath();ctx.moveTo(this.trail[0][0],this.trail[0][1]);
      this.trail.forEach(([x,y])=>ctx.lineTo(x,y));
      ctx.strokeStyle=`rgba(255,255,255,${a*.15})`;ctx.lineWidth=this.sz*.4;ctx.stroke();
    }
    ctx.beginPath();ctx.arc(this.x,this.y,this.sz,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${a*.88})`;ctx.fill();
  }
}

function resetParticles(){
  particles=[];
  const n=Math.floor(700*densityFactor);
  for(let i=0;i<n;i++)particles.push(new P());
}

function loop(){
  ctx.fillStyle='rgba(0,0,0,0.13)';ctx.fillRect(0,0,W,H);
  buildAnchors();drawReference();
  particles.forEach(p=>{p.update();p.draw();});
  vhx=mx-pmx;vhy=my-pmy;
  swipeActive=Math.abs(vhx)>7&&Math.abs(vhx)>Math.abs(vhy)*1.3;
  if(swipeActive)leg('swipe',true);else leg('swipe',false);
  pmx=mx;pmy=my;frame++;
  requestAnimationFrame(loop);
}

function leg(id,on){document.getElementById('leg-'+id)?.classList.toggle('active',on);}
function status(t){const el=document.getElementById('status');if(el)el.textContent=t;}

function initEngine(){
  canvas=document.getElementById('c');
  ctx=canvas.getContext('2d');
  resize();resetParticles();loop();
  window.addEventListener('resize',resize);
  canvas.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();mx=e.touches[0].clientX;my=e.touches[0].clientY;},{passive:false});
  document.addEventListener('keydown',e=>{
    if(e.key==='+'||e.key==='='){expandFactor=Math.min(1.9,expandFactor+.12);status('EXPANDIENDO');}
    if(e.key==='-'){expandFactor=Math.max(0.3,expandFactor-.12);status('CONTRAYENDO');}
    if(e.key==='r'||e.key==='R'){expandFactor=1.0;densityFactor=1.0;resetParticles();status('RESET');}
  });
  initCamera();
}
</script>
<script>
async function initCamera(){
  try {
    const video = document.getElementById('video');
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user', width:640, height:480}
    });
    video.srcObject = stream;
    await video.play();
    status('CARGANDO MEDIAPIPE...');

    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.75,
      minTrackingConfidence: 0.6
    });

    hands.onResults(r => {
      status('');
      if(r.multiHandLandmarks && r.multiHandLandmarks.length > 0){
        const lm = r.multiHandLandmarks[0];
        mx = (1 - lm[9].x) * W;
        my = lm[9].y * H;
        const g = detectGesture(lm);
        applyGesture(g);

        if(r.multiHandLandmarks.length > 1){
          const lm2 = r.multiHandLandmarks[1];
          const dx = lm[9].x - lm2[9].x;
          const dy = lm[9].y - lm2[9].y;
          const nd = Math.max(0.3, Math.min(2.2, Math.sqrt(dx*dx+dy*dy)*4));
          if(Math.abs(nd - densityFactor) > 0.15){
            densityFactor = nd;
            resetParticles();
            status('DENSIDAD ' + Math.round(nd*100) + '%');
            leg('hands2', true);
          } else {
            leg('hands2', false);
          }
        }
      } else {
        lastGesture = '';
        ['open','fist','pinch'].forEach(id => leg(id, false));
      }
    });

    const cam = new Camera(video, {
      onFrame: async () => await hands.send({image: video}),
      width: 640, height: 480
    });
    cam.start();
    status('GESTOS ACTIVOS');

  } catch(e) {
    status('SIN CAMARA — MODO RATON');
  }
}

function detectGesture(lm){
  const tips=[8,12,16,20], mids=[6,10,14,18];
  const ext = tips.map((t,i) => lm[t].y < lm[mids[i]].y);
  const n = ext.filter(Boolean).length;
  const thumb = lm[4].x < lm[3].x;
  const pdx = lm[4].x - lm[8].x;
  const pdy = lm[4].y - lm[8].y;
  if(Math.sqrt(pdx*pdx + pdy*pdy) < 0.055) return 'pinch';
  if(n === 0 && !thumb) return 'fist';
  if(n >= 4) return 'open';
  return 'none';
}

let lastGesture = '';
function applyGesture(g){
  ['open','fist','pinch'].forEach(id => leg(id, false));
  if(g !== 'none') leg(g, true);
  if(g === lastGesture) return;
  lastGesture = g;
  if(g === 'open'){
    expandFactor = Math.min(1.9, expandFactor + .12);
    status('EXPANDIENDO');
  } else if(g === 'fist'){
    expandFactor = Math.max(0.3, expandFactor - .12);
    status('CONTRAYENDO');
  } else if(g === 'pinch'){
    expandFactor = 1.0;
    densityFactor = 1.0;
    resetParticles();
    status('RESET');
  }
}
</script>
<script>initEngine();</script>
