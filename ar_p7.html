<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>La Forma Encontrada — AR — TRIÁNGULO</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; font-family:'Courier New',monospace; overflow:hidden; }
#ar-wrapper { position:fixed; inset:0; width:100%; height:100%; z-index:1; display:none; }
#ar-wrapper video { position:absolute; inset:0; width:100%!important; height:100%!important; object-fit:cover; z-index:1; }
#ar-wrapper canvas { position:absolute; inset:0; width:100%!important; height:100%!important; z-index:2; background:transparent!important; }
#splash { position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; }
.s-title { color:#C04828; font-size:16px; letter-spacing:4px; margin-bottom:6px; text-align:center; }
.s-sub { color:#333; font-size:9px; letter-spacing:3px; margin-bottom:40px; text-align:center; }
.s-btn { background:transparent; border:1px solid #C04828; color:#C04828; font-family:'Courier New',monospace; font-size:11px; letter-spacing:3px; padding:14px 0; cursor:pointer; width:260px; margin-bottom:12px; }
.s-back { border:1px solid #222; color:#333; text-decoration:none; text-align:center; display:block; padding:10px 0; width:260px; font-size:10px; letter-spacing:2px; font-family:'Courier New',monospace; }
.s-note { color:#222; font-size:8px; letter-spacing:1px; text-align:center; margin-top:24px; line-height:2; }
#loading { position:fixed; inset:0; background:#000; z-index:9998; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
#loading p { color:#333; font-size:9px; letter-spacing:3px; }
#ui { position:fixed; top:0; left:0; right:0; z-index:200; pointer-events:none; display:none; justify-content:space-between; align-items:flex-start; padding:16px 20px; }
.htitle { color:#C04828; font-size:11px; letter-spacing:3px; text-shadow:0 0 8px rgba(0,0,0,0.8); }
.hmode { color:#aaa; font-size:9px; letter-spacing:2px; margin-top:4px; }
.back { pointer-events:all; background:rgba(0,0,0,0.7); border:0.5px solid #333; color:#aaa; font-family:'Courier New',monospace; font-size:9px; letter-spacing:2px; padding:6px 14px; cursor:pointer; text-decoration:none; }
#hint { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,0.6); font-size:9px; letter-spacing:2px; text-align:center; z-index:200; width:90%; display:none; text-shadow:0 0 8px rgba(0,0,0,0.9); }
</style>
</head>
<body>

<div id="ar-wrapper"></div>

<div id="splash">
  <div class="s-title">LA FORMA ENCONTRADA</div>
  <div class="s-sub">AR — TRIÁNGULO</div>
  <button class="s-btn" id="startBtn">▶ ACTIVAR CÁMARA AR</button>
  <a class="s-back" href="index.html">← VOLVER AL MENÚ</a>
  <div class="s-note" id="note">
    Acepta el permiso de cámara cuando aparezca.<br>
    Después apunta a la página 7 del libro.
  </div>
</div>

<div id="loading"><p id="loadingText">INICIANDO...</p></div>

<div id="ui">
  <div>
    <div class="htitle">LA FORMA ENCONTRADA</div>
    <div class="hmode">AR — TRIÁNGULO</div>
  </div>
  <a class="back" href="index.html">← MENÚ</a>
</div>
<div id="hint">APUNTA A LA PÁGINA 7 DEL LIBRO</div>

<!-- Cargar Three.js primero, luego MindAR en orden correcto -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-three.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14/build/Tone.js"></script>

<script>

function buildScene_p7(group) {
  const mR=new THREE.LineBasicMaterial({color:0xC04828});
  const mB=new THREE.LineDashedMaterial({color:0x185FA5,dashSize:0.04,gapSize:0.02});
  function tri(r,y,m){
    const p=[];for(let i=0;i<4;i++){const a=Math.PI*(-0.5+(i%3)*2/3);p.push(new THREE.Vector3(r*Math.cos(a),y,r*Math.sin(a)));}
    const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),m);l.computeLineDistances();return l;
  }
  group.add(tri(0.35,0,mR));group.add(tri(0.27,-0.08,mB));
  for(let i=0;i<3;i++){
    const a=Math.PI*(-0.5+i*2/3);
    const s=new THREE.Mesh(new THREE.SphereGeometry(0.014,8,8),new THREE.MeshBasicMaterial({color:0xC04828}));
    s.position.set(0.35*Math.cos(a),0,0.35*Math.sin(a));group.add(s);
  }
  const N=200,pos=new Float32Array(N*3),vel=[];
  for(let i=0;i<N;i++){
    const v=Math.floor(Math.random()*3),a=Math.PI*(-0.5+v*2/3);
    pos[i*3]=0.35*Math.cos(a)+(Math.random()-.5)*0.04;
    pos[i*3+1]=(Math.random()-.5)*0.04;
    pos[i*3+2]=0.35*Math.sin(a)+(Math.random()-.5)*0.04;
    vel.push({x:(Math.random()-.5)*0.003,y:(Math.random()-.5)*0.003,z:(Math.random()-.5)*0.003,life:Math.random(),max:0.8+Math.random()*0.5,v});
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({color:0xffffff,size:0.008,transparent:true,opacity:0.8});
  group.add(new THREE.Points(geo,mat));
  group.userData.p={geo,mat,vel,pos,N};
}

function buildScene_p33(group) {
  const mR=new THREE.LineBasicMaterial({color:0xC04828});
  const mB=new THREE.LineDashedMaterial({color:0x185FA5,dashSize:0.03,gapSize:0.02});
  const mC=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.2});
  function tri(r,y,m){
    const p=[];for(let i=0;i<4;i++){const a=Math.PI*(-0.5+(i%3)*2/3);p.push(new THREE.Vector3(r*Math.cos(a),y,r*Math.sin(a)));}
    const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),m);l.computeLineDistances();return l;
  }
  group.add(tri(0.32,0,mR));
  const bt=tri(0.24,-0.1,mB);group.add(bt);group.userData.bt=bt;
  for(let i=0;i<3;i++){
    const a=Math.PI*(-0.5+i*2/3);
    const p=[new THREE.Vector3(0.32*Math.cos(a),0,0.32*Math.sin(a)),new THREE.Vector3(0.24*Math.cos(a),-0.1,0.24*Math.sin(a))];
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),mC));
    const s=new THREE.Mesh(new THREE.SphereGeometry(0.012,8,8),new THREE.MeshBasicMaterial({color:0xC04828}));
    s.position.set(0.32*Math.cos(a),0,0.32*Math.sin(a));group.add(s);
  }
  const rings=[];
  for(let r=0.08;r<0.5;r+=0.08){
    const p=[];for(let i=0;i<=64;i++){const a=i/64*Math.PI*2;p.push(new THREE.Vector3(r*Math.cos(a),0,r*Math.sin(a)));}
    const m=new THREE.LineBasicMaterial({color:0x185FA5,transparent:true,opacity:0.12});
    const ring=new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),m);
    rings.push(ring);group.add(ring);
  }
  group.userData.rings=rings;
}

function animateScene(group,f){
  group.rotation.y=f*0.005;
  if(group.userData.p){
    const {geo,mat,vel,pos,N}=group.userData.p;
    for(let i=0;i<N;i++){
      const v=vel[i];v.life+=0.004;
      if(v.life>v.max){
        const a=Math.PI*(-0.5+v.v*2/3);
        pos[i*3]=0.35*Math.cos(a)+(Math.random()-.5)*0.03;
        pos[i*3+1]=(Math.random()-.5)*0.03;
        pos[i*3+2]=0.35*Math.sin(a)+(Math.random()-.5)*0.03;
        v.life=0;v.x=(Math.random()-.5)*0.003;v.y=(Math.random()-.5)*0.003;v.z=(Math.random()-.5)*0.003;
      }else{pos[i*3]+=v.x;pos[i*3+1]+=v.y;pos[i*3+2]+=v.z;}
    }
    geo.attributes.position.needsUpdate=true;
    mat.opacity=0.5+Math.sin(f*0.05)*0.3;
  }
  if(group.userData.rings){
    group.userData.rings.forEach((r,i)=>{r.scale.setScalar(1+Math.sin(f*0.025+i*0.5)*0.15);r.material.opacity=0.06+Math.sin(f*0.03+i*0.8)*0.06;});
    if(group.userData.bt){group.userData.bt.position.y=Math.sin(f*0.02)*0.05;group.userData.bt.scale.setScalar(1+Math.sin(f*0.015)*0.08);}
  }
}


document.getElementById('startBtn').addEventListener('click', async () => {
  document.getElementById('splash').style.display = 'none';
  document.getElementById('loading').style.display = 'flex';

  try {
    document.getElementById('loadingText').textContent = 'SOLICITANDO CÁMARA...';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    stream.getTracks().forEach(t => t.stop());

    document.getElementById('loadingText').textContent = 'CARGANDO AR...';

    // Verificar que MindAR está disponible
    if (!window.MINDAR || !window.MINDAR.IMAGE) {
      throw new Error('MindAR no cargó correctamente — recarga la página');
    }

    const wrapper = document.getElementById('ar-wrapper');
    wrapper.style.display = 'block';

    const mindarThree = new window.MINDAR.IMAGE.MindARThree({
      container: wrapper,
      imageTargetSrc: 'https://jcclimentcanto.github.io/la-forma-encontrada/targets.mind',
      maxTrack: 1,
      uiLoading: 'no',
      uiError: 'no',
      uiScanning: 'no',
      filterMinCF: 0.001,
      filterBeta: 0.01
    });

    const { renderer, scene, camera } = mindarThree;
    renderer.setClearColor(0x000000, 0);

    const anchor = mindarThree.addAnchor(0);
    const group = new THREE.Group();
    anchor.group.add(group);
    buildScene_p7(group);

    anchor.onTargetFound = () => {
      document.getElementById('hint').textContent = '✓ MARCADOR DETECTADO';
      startAudio();
    };
    anchor.onTargetLost = () => {
      document.getElementById('hint').textContent = 'APUNTA A LA PÁGINA 7 DEL LIBRO';
    };

    let frame = 0;
    renderer.setAnimationLoop(() => {
      frame++;
      animateScene(group, frame);
      renderer.render(scene, camera);
    });

    await mindarThree.start();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('ui').style.display = 'flex';
    document.getElementById('hint').style.display = 'block';

  } catch(e) {
    console.error(e);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('ar-wrapper').style.display = 'none';
    document.getElementById('splash').style.display = 'flex';
    document.getElementById('startBtn').textContent = '↺ REINTENTAR';
    document.getElementById('note').textContent = 'Error: ' + (e.message || e.name);
  }
});

let audioReady = false;
async function startAudio() {
  if (audioReady) return;
  try {
    await Tone.start();
    const rev = new Tone.Reverb({ decay:6, wet:0.65 }).toDestination();
    const synth = new Tone.PolySynth(Tone.Synth, {
      oscillator:{type:'sine'},
      envelope:{attack:3, sustain:1, release:5}
    }).connect(rev);
    synth.volume.value = -20;
    synth.triggerAttack(['D2','A2']);
    audioReady = true;
  } catch(e) { console.warn('Audio:', e); }
}
</script>
</body>
</html>
