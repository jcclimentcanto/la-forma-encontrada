<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Forma Encontrada — AR Triángulo</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Courier New',monospace; }
#ui {
  position:fixed; top:0; left:0; right:0; z-index:999; pointer-events:none;
  display:flex; justify-content:space-between; align-items:flex-start; padding:16px 20px;
}
.htitle { color:#C04828; font-size:11px; letter-spacing:3px; }
.hmode  { color:#333; font-size:9px; letter-spacing:2px; margin-top:4px; }
.back {
  pointer-events:all; background:transparent; border:0.5px solid #181816;
  color:#333; font-family:'Courier New',monospace; font-size:9px; letter-spacing:2px;
  padding:6px 14px; cursor:pointer; text-decoration:none; transition:all 0.3s;
}
.back:hover { border-color:#C04828; color:#C04828; }
#hint {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,0.4); font-size:9px; letter-spacing:2px;
  font-family:'Courier New',monospace; text-align:center; pointer-events:none;
  z-index:999;
}
</style>
</head>
<body>
<div id="ui">
  <div>
    <div class="htitle">LA FORMA ENCONTRADA</div>
    <div class="hmode">AR — TRIÁNGULO</div>
  </div>
  <a class="back" href="index.html">← MENÚ</a>
</div>
<div id="hint">APUNTA LA CÁMARA A LA PÁGINA 7 DEL LIBRO</div>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-three.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14/build/Tone.js"></script>

<script>
const BASE = 'https://jcclimentcanto.github.io/la-forma-encontrada/';

async function start() {
  const mindarThree = new window.MINDAR.IMAGE.MindARThree({
    container: document.body,
    imageTargetSrc: BASE + 'targets.mind',
    maxTrack: 1,
    uiLoading: 'no',
    uiError: 'no',
    uiScanning: 'no'
  });

  const { renderer, scene, camera } = mindarThree;

  // Anchor para la página 7 — índice 0
  const anchor = mindarThree.addAnchor(0);

  // Grupo principal sobre la imagen
  const group = new THREE.Group();
  anchor.group.add(group);

  // Triángulo 3D animado
  const red = new THREE.LineBasicMaterial({ color: 0xC04828, linewidth: 2 });
  const blue = new THREE.LineDashedMaterial({ color: 0x185FA5, linewidth: 1, dashSize: 0.04, gapSize: 0.02 });

  function makeTriangle(r, y, mat) {
    const pts = [];
    for (let i = 0; i < 4; i++) {
      const a = Math.PI * (-0.5 + (i % 3) * 2 / 3);
      pts.push(new THREE.Vector3(r * Math.cos(a), y, r * Math.sin(a)));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.Line(geo, mat);
    line.computeLineDistances();
    return line;
  }

  const triRed  = makeTriangle(0.35, 0, red);
  const triBlue = makeTriangle(0.28, -0.08, blue);
  group.add(triRed, triBlue);

  // Vértices como esferas
  for (let i = 0; i < 3; i++) {
    const a = Math.PI * (-0.5 + i * 2 / 3);
    const geo = new THREE.SphereGeometry(0.015, 8, 8);
    const mat = new THREE.MeshBasicMaterial({ color: 0xC04828 });
    const sphere = new THREE.Mesh(geo, mat);
    sphere.position.set(0.35 * Math.cos(a), 0, 0.35 * Math.sin(a));
    group.add(sphere);
  }

  // Partículas saliendo de los vértices
  const particleCount = 300;
  const positions = new Float32Array(particleCount * 3);
  const velocities = [];

  for (let i = 0; i < particleCount; i++) {
    const vertex = Math.floor(Math.random() * 3);
    const a = Math.PI * (-0.5 + vertex * 2 / 3);
    positions[i*3]   = 0.35 * Math.cos(a) + (Math.random()-0.5)*0.05;
    positions[i*3+1] = (Math.random()-0.5)*0.05;
    positions[i*3+2] = 0.35 * Math.sin(a) + (Math.random()-0.5)*0.05;
    velocities.push({
      x: (Math.random()-0.5)*0.004,
      y: (Math.random()-0.5)*0.004,
      z: (Math.random()-0.5)*0.004,
      life: Math.random(),
      maxLife: 0.8 + Math.random() * 0.4,
      vertex
    });
  }

  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const pMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.008, transparent: true, opacity: 0.8 });
  const points = new THREE.Points(pGeo, pMat);
  group.add(points);

  // Audio
  let audioReady = false;
  anchor.onTargetFound = async () => {
    document.getElementById('hint').textContent = 'MARCADOR DETECTADO';
    if (!audioReady) {
      await Tone.start();
      const reverb = new Tone.Reverb({ decay: 5, wet: 0.6 }).toDestination();
      const drone = new Tone.Synth({
        oscillator: { type: 'sine' },
        envelope: { attack: 3, sustain: 1, release: 5 }
      }).connect(reverb);
      drone.volume.value = -18;
      drone.triggerAttack('D2');
      audioReady = true;
    }
  };
  anchor.onTargetLost = () => {
    document.getElementById('hint').textContent = 'APUNTA LA CÁMARA A LA PÁGINA 7 DEL LIBRO';
  };

  // Loop
  let frame = 0;
  renderer.setAnimationLoop(() => {
    frame++;
    // Rotar el triángulo lentamente
    group.rotation.y = frame * 0.008;

    // Animar partículas
    const pos = pGeo.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      const v = velocities[i];
      v.life += 0.004;
      if (v.life > v.maxLife) {
        // Reset a vértice
        const a = Math.PI * (-0.5 + v.vertex * 2/3);
        pos[i*3]   = 0.35*Math.cos(a) + (Math.random()-0.5)*0.03;
        pos[i*3+1] = (Math.random()-0.5)*0.03;
        pos[i*3+2] = 0.35*Math.sin(a) + (Math.random()-0.5)*0.03;
        v.life = 0;
        v.x = (Math.random()-0.5)*0.004;
        v.y = (Math.random()-0.5)*0.004;
        v.z = (Math.random()-0.5)*0.004;
      } else {
        pos[i*3]   += v.x;
        pos[i*3+1] += v.y;
        pos[i*3+2] += v.z;
      }
    }
    pGeo.attributes.position.needsUpdate = true;
    pMat.opacity = 0.5 + Math.sin(frame*0.05)*0.3;

    renderer.render(scene, camera);
  });

  await mindarThree.start();
}

start();
</script>
</body>
</html>
