<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>La Forma Encontrada — AR — TRIÁNGULO</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Courier New',monospace; }

#splash {
  position:fixed; inset:0; background:#000; z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:30px;
}
.s-title { color:#C04828; font-size:16px; letter-spacing:4px; margin-bottom:6px; text-align:center; }
.s-sub { color:#333; font-size:9px; letter-spacing:3px; margin-bottom:40px; text-align:center; }
.s-btn {
  background:transparent; border:1px solid #C04828; color:#C04828;
  font-family:'Courier New',monospace; font-size:11px; letter-spacing:3px;
  padding:14px 0; cursor:pointer; width:260px; margin-bottom:12px;
}
.s-btn:hover { background:#C04828; color:#000; }
.s-note { color:#222; font-size:8px; letter-spacing:1px; text-align:center; margin-top:20px; line-height:1.8; }

#ar-container { display:none; width:100vw; height:100vh; position:relative; }
#ui {
  position:fixed; top:0; left:0; right:0; z-index:999; pointer-events:none;
  display:flex; justify-content:space-between; align-items:flex-start; padding:16px 20px;
}
.htitle { color:#C04828; font-size:11px; letter-spacing:3px; }
.hmode  { color:#333; font-size:9px; letter-spacing:2px; margin-top:4px; }
.back {
  pointer-events:all; background:transparent; border:0.5px solid #181816;
  color:#333; font-family:'Courier New',monospace; font-size:9px; letter-spacing:2px;
  padding:6px 14px; cursor:pointer; text-decoration:none; transition:all 0.3s;
}
.back:hover { border-color:#C04828; color:#C04828; }
#hint {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,0.4); font-size:9px; letter-spacing:2px;
  font-family:'Courier New',monospace; text-align:center; pointer-events:none;
  z-index:999; width:90%;
}
#loading {
  position:fixed; inset:0; background:#000; z-index:9998;
  display:none; flex-direction:column; align-items:center; justify-content:center;
}
#loading p { color:#333; font-size:9px; letter-spacing:3px; font-family:'Courier New',monospace; }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="s-title">LA FORMA ENCONTRADA</div>
  <div class="s-sub">AR — TRIÁNGULO</div>
  <button class="s-btn" onclick="startAR()">▶ ACTIVAR CÁMARA AR</button>
  <a class="s-btn" href="index.html" style="text-decoration:none;text-align:center;display:block;border-color:#222;color:#333;">← VOLVER AL MENÚ</a>
  <div class="s-note">
    Permite el acceso a la cámara cuando el navegador lo solicite.<br>
    Después apunta LA CÁMARA A LA PÁGINA 7 DEL LIBRO
  </div>
</div>

<!-- LOADING -->
<div id="loading">
  <p>CARGANDO AR...</p>
</div>

<!-- AR -->
<div id="ar-container"></div>
<div id="ui" style="display:none;">
  <div>
    <div class="htitle">LA FORMA ENCONTRADA</div>
    <div class="hmode">AR — TRIÁNGULO</div>
  </div>
  <a class="back" href="index.html">← MENÚ</a>
</div>
<div id="hint" style="display:none;">APUNTA LA CÁMARA A LA PÁGINA 7 DEL LIBRO</div>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-three.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14/build/Tone.js"></script>

<script>
async function startAR() {
  document.getElementById('splash').style.display = 'none';
  document.getElementById('loading').style.display = 'flex';

  try {
    const container = document.getElementById('ar-container');
    container.style.display = 'block';

    const mindarThree = new window.MINDAR.IMAGE.MindARThree({
      container: container,
      imageTargetSrc: 'https://jcclimentcanto.github.io/la-forma-encontrada/targets.mind',
      maxTrack: 1,
      uiLoading: 'no',
      uiError: 'no',
      uiScanning: 'no'
    });

    const { renderer, scene, camera } = mindarThree;
    const anchor = mindarThree.addAnchor(0);
    const group = new THREE.Group();
    anchor.group.add(group);

    buildScene_p7(group);

    anchor.onTargetFound = () => {
      document.getElementById('hint').textContent = '✓ MARCADOR DETECTADO';
      startAudio();
    };
    anchor.onTargetLost = () => {
      document.getElementById('hint').textContent = 'APUNTA LA CÁMARA A LA PÁGINA 7 DEL LIBRO';
    };

    let frame = 0;
    renderer.setAnimationLoop(() => {
      frame++;
      animateScene(group, frame);
      renderer.render(scene, camera);
    });

    await mindarThree.start();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('ui').style.display = 'flex';
    document.getElementById('hint').style.display = 'block';

  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('splash').style.display = 'flex';
    alert('No se pudo acceder a la cámara. Comprueba los permisos del navegador.');
  }
}

// ── AUDIO ──
let audioReady = false;
async function startAudio() {
  if (audioReady) return;
  await Tone.start();
  const reverb = new Tone.Reverb({ decay: 6, wet: 0.65 }).toDestination();
  const synth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'sine' },
    envelope: { attack: 3, sustain: 1, release: 5 }
  }).connect(reverb);
  synth.volume.value = -20;
  synth.triggerAttack(['D2','A2']);
  audioReady = true;
}

// ── ESCENA PÁGINA 7 — TRIÁNGULO ──
function buildScene_p7(group) {
  const matRed = new THREE.LineBasicMaterial({ color: 0xC04828 });
  const matBlue = new THREE.LineDashedMaterial({ color: 0x185FA5, dashSize:0.04, gapSize:0.02 });

  function makeTri(r, y, mat) {
    const pts = [];
    for (let i=0; i<4; i++) { const a=Math.PI*(-0.5+(i%3)*2/3); pts.push(new THREE.Vector3(r*Math.cos(a),y,r*Math.sin(a))); }
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat);
    line.computeLineDistances(); return line;
  }
  group.add(makeTri(0.35, 0, matRed));
  group.add(makeTri(0.27, -0.08, matBlue));

  for (let i=0; i<3; i++) {
    const a=Math.PI*(-0.5+i*2/3);
    const s=new THREE.Mesh(new THREE.SphereGeometry(0.014,8,8), new THREE.MeshBasicMaterial({color:0xC04828}));
    s.position.set(0.35*Math.cos(a),0,0.35*Math.sin(a)); group.add(s);
  }

  // Partículas
  const N=300, pos=new Float32Array(N*3), vel=[];
  for (let i=0; i<N; i++) {
    const v=Math.floor(Math.random()*3), a=Math.PI*(-0.5+v*2/3);
    pos[i*3]=0.35*Math.cos(a)+(Math.random()-.5)*0.04;
    pos[i*3+1]=(Math.random()-.5)*0.04;
    pos[i*3+2]=0.35*Math.sin(a)+(Math.random()-.5)*0.04;
    vel.push({x:(Math.random()-.5)*0.003,y:(Math.random()-.5)*0.003,z:(Math.random()-.5)*0.003,life:Math.random(),max:0.8+Math.random()*0.5,v});
  }
  const pGeo=new THREE.BufferGeometry();
  pGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pMat=new THREE.PointsMaterial({color:0xffffff,size:0.008,transparent:true,opacity:0.8});
  const pts=new THREE.Points(pGeo,pMat);
  group.add(pts);
  group.userData.particles={geo:pGeo,mat:pMat,vel,pos,N};
}

// ── ESCENA PÁGINA 33 — PROYECCIÓN ──
function buildScene_p33(group) {
  const matRed=new THREE.LineBasicMaterial({color:0xC04828});
  const matBlue=new THREE.LineDashedMaterial({color:0x185FA5,dashSize:0.03,gapSize:0.02});
  const matConn=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.2});

  function makeTri(r,y,mat) {
    const pts=[];
    for(let i=0;i<4;i++){const a=Math.PI*(-0.5+(i%3)*2/3);pts.push(new THREE.Vector3(r*Math.cos(a),y,r*Math.sin(a)));}
    const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat);
    l.computeLineDistances();return l;
  }
  group.add(makeTri(0.32,0,matRed));
  const blueT=makeTri(0.24,-0.1,matBlue);
  group.add(blueT);
  group.userData.blueT=blueT;

  for(let i=0;i<3;i++){
    const a=Math.PI*(-0.5+i*2/3);
    const pts=[new THREE.Vector3(0.32*Math.cos(a),0,0.32*Math.sin(a)),new THREE.Vector3(0.24*Math.cos(a),-0.1,0.24*Math.sin(a))];
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),matConn));
    const s=new THREE.Mesh(new THREE.SphereGeometry(0.012,8,8),new THREE.MeshBasicMaterial({color:0xC04828}));
    s.position.set(0.32*Math.cos(a),0,0.32*Math.sin(a));group.add(s);
  }

  const rings=[];
  for(let r=0.08;r<0.5;r+=0.08){
    const pts=[];
    for(let i=0;i<=64;i++){const a=i/64*Math.PI*2;pts.push(new THREE.Vector3(r*Math.cos(a),0,r*Math.sin(a)));}
    const mat=new THREE.LineBasicMaterial({color:0x185FA5,transparent:true,opacity:0.12});
    const ring=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat);
    ring.userData.baseR=r; rings.push(ring); group.add(ring);
  }
  group.userData.rings=rings;
}

// ── ANIMACIÓN ──
function animateScene(group, frame) {
  group.rotation.y = frame * 0.005;

  // Partículas (p7)
  if (group.userData.particles) {
    const {geo,mat,vel,pos,N} = group.userData.particles;
    for(let i=0;i<N;i++){
      const v=vel[i]; v.life+=0.004;
      if(v.life>v.max){
        const a=Math.PI*(-0.5+v.v*2/3);
        pos[i*3]=0.35*Math.cos(a)+(Math.random()-.5)*0.03;
        pos[i*3+1]=(Math.random()-.5)*0.03;
        pos[i*3+2]=0.35*Math.sin(a)+(Math.random()-.5)*0.03;
        v.life=0;v.x=(Math.random()-.5)*0.003;v.y=(Math.random()-.5)*0.003;v.z=(Math.random()-.5)*0.003;
      } else { pos[i*3]+=v.x;pos[i*3+1]+=v.y;pos[i*3+2]+=v.z; }
    }
    geo.attributes.position.needsUpdate=true;
    mat.opacity=0.5+Math.sin(frame*0.05)*0.3;
  }

  // Anillos (p33)
  if (group.userData.rings) {
    group.userData.rings.forEach((r,i)=>{
      r.scale.setScalar(1+Math.sin(frame*0.025+i*0.5)*0.15);
      r.material.opacity=0.06+Math.sin(frame*0.03+i*0.8)*0.06;
    });
    if(group.userData.blueT){
      group.userData.blueT.position.y=Math.sin(frame*0.02)*0.05;
      group.userData.blueT.scale.setScalar(1+Math.sin(frame*0.015)*0.08);
    }
  }
}
</script>
</body>
</html>
