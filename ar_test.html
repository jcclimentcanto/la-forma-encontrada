<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AR Test</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; font-family:'Courier New',monospace; color:#fff; padding:20px; }
button { background:transparent; border:1px solid #C04828; color:#C04828; font-family:'Courier New',monospace; font-size:11px; padding:14px 20px; cursor:pointer; margin:8px 0; display:block; width:100%; }
#log { margin-top:20px; font-size:10px; line-height:2; color:#888; word-break:break-all; }
.ok { color:#4CAF50; } .err { color:#C04828; }
#video-test { width:100%; max-height:200px; margin-top:10px; background:#111; }
.sline { font-size:9px; margin:3px 0; color:#555; }
</style>
</head>
<body>

<div style="color:#C04828;font-size:12px;letter-spacing:3px;margin-bottom:4px;">AR DIAGNÓSTICO</div>
<div style="color:#333;font-size:9px;letter-spacing:2px;margin-bottom:16px;">v10 — todo local</div>

<div class="sline" id="s-three">three.min.js: ...</div>
<div class="sline" id="s-mindar">mindar-image.prod.js: ...</div>

<button onclick="testCamera()">1. PROBAR CÁMARA</button>
<button onclick="testMindAR()">2. INSPECCIONAR MINDAR</button>
<button onclick="testFull()">3. TEST COMPLETO</button>
<a href="index.html" style="color:#333;font-size:10px;letter-spacing:2px;display:block;margin-top:10px;">← VOLVER</a>

<video id="video-test" autoplay playsinline muted></video>
<div id="log"></div>

<script src="three.min.js"
  onload="document.getElementById('s-three').textContent='three.min.js: ✓ cargado';document.getElementById('s-three').style.color='#4CAF50';"
  onerror="document.getElementById('s-three').textContent='three.min.js: ✗ NO ENCONTRADO';document.getElementById('s-three').style.color='#C04828';"></script>
<script src="mindar-image.prod.js"
  onload="document.getElementById('s-mindar').textContent='mindar-image.prod.js: ✓ cargado';document.getElementById('s-mindar').style.color='#4CAF50';"
  onerror="document.getElementById('s-mindar').textContent='mindar-image.prod.js: ✗ NO ENCONTRADO';document.getElementById('s-mindar').style.color='#C04828';"></script>

<script>
const log = document.getElementById('log');
function msg(text, type='') {
  const p = document.createElement('p');
  p.textContent = text; p.className = type;
  log.appendChild(p);
}

async function testCamera() {
  log.innerHTML = '';
  msg('Probando cámara...');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    msg('✓ Cámara OK', 'ok');
    document.getElementById('video-test').srcObject = stream;
    const t = stream.getVideoTracks()[0];
    msg('Dispositivo: ' + t.label);
  } catch(e) {
    msg('✗ ' + e.name + ': ' + e.message, 'err');
  }
}

function testMindAR() {
  log.innerHTML = '';
  msg('THREE: ' + (typeof THREE !== 'undefined' ? '✓' : '✗'));
  msg('window.MINDAR: ' + typeof window.MINDAR);
  if (window.MINDAR) {
    msg('MINDAR keys: ' + Object.keys(window.MINDAR).join(', '), 'ok');
    if (window.MINDAR.IMAGE) {
      msg('✓ MINDAR.IMAGE existe', 'ok');
      msg('MindARThree: ' + typeof window.MINDAR.IMAGE.MindARThree);
    }
  }
  const mindKeys = Object.keys(window).filter(k => k.toLowerCase().includes('mind'));
  msg('Globals mind: ' + (mindKeys.join(', ') || 'ninguno'));
}

async function testFull() {
  log.innerHTML = '';
  msg('Test completo...');
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    msg('✓ Cámara OK', 'ok');
    s.getTracks().forEach(t => t.stop());
  } catch(e) { msg('✗ Cámara: ' + e.message, 'err'); return; }

  const MindARThree = window.MINDAR?.IMAGE?.MindARThree;
  if (!MindARThree) { msg('✗ MindARThree no encontrado', 'err'); return; }
  msg('✓ MindARThree OK', 'ok');

  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'position:fixed;inset:0;z-index:1;';
  document.body.appendChild(wrapper);
  try {
    const m = new MindARThree({
      container: wrapper,
      imageTargetSrc: 'targets.mind',
      maxTrack: 1, uiLoading:'no', uiError:'no', uiScanning:'no'
    });
    msg('✓ Instancia creada', 'ok');
    msg('Iniciando AR...');
    await m.start();
    msg('✓ AR FUNCIONA!', 'ok');
    setTimeout(() => { m.stop(); wrapper.remove(); msg('Detenido.'); }, 5000);
  } catch(e) {
    msg('✗ ' + (e.message || e.name), 'err');
    wrapper.remove();
  }
}
</script>
</body>
</html>
