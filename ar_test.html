<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AR Test</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; font-family:'Courier New',monospace; color:#fff; padding:20px; }
button { background:transparent; border:1px solid #C04828; color:#C04828; font-family:'Courier New',monospace; font-size:11px; padding:14px 20px; cursor:pointer; margin:8px 0; display:block; width:100%; }
#log { margin-top:20px; font-size:10px; line-height:2; color:#888; }
.ok { color:#4CAF50; }
.err { color:#C04828; }
#video-test { width:100%; max-height:200px; margin-top:10px; background:#111; }
</style>
</head>
<body>
<div style="color:#C04828;font-size:12px;letter-spacing:3px;margin-bottom:20px;">AR DIAGNÓSTICO</div>

<button onclick="testCamera()">1. PROBAR CÁMARA</button>
<button onclick="testMindAR()">2. PROBAR MINDAR</button>
<button onclick="testFull()">3. TEST COMPLETO</button>
<a href="index.html" style="color:#333;font-size:10px;letter-spacing:2px;display:block;margin-top:10px;">← VOLVER</a>

<video id="video-test" autoplay playsinline muted></video>
<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-three.prod.js"></script>

<script>
const log = document.getElementById('log');
function msg(text, type='') {
  const p = document.createElement('p');
  p.textContent = text;
  p.className = type;
  log.appendChild(p);
  console.log(text);
}

async function testCamera() {
  log.innerHTML = '';
  msg('Probando cámara...');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    msg('✓ Cámara trasera OK', 'ok');
    const video = document.getElementById('video-test');
    video.srcObject = stream;
    msg('✓ Video stream activo — deberías ver imagen', 'ok');
    const track = stream.getVideoTracks()[0];
    msg('Dispositivo: ' + track.label);
    const settings = track.getSettings();
    msg('Resolución: ' + settings.width + 'x' + settings.height);
    msg('FacingMode: ' + (settings.facingMode || 'no disponible'));
  } catch(e) {
    msg('✗ Error cámara: ' + e.name + ' — ' + e.message, 'err');
  }
}

async function testMindAR() {
  log.innerHTML = '';
  msg('Probando MindAR...');
  try {
    msg('MINDAR disponible: ' + (typeof window.MINDAR !== 'undefined' ? '✓' : '✗'));
    msg('THREE disponible: ' + (typeof THREE !== 'undefined' ? '✓' : '✗'));
    msg('MindARThree disponible: ' + (typeof window.MINDAR?.IMAGE?.MindARThree !== 'undefined' ? '✓' : '✗'));
  } catch(e) {
    msg('✗ Error: ' + e.message, 'err');
  }
}

async function testFull() {
  log.innerHTML = '';
  msg('Test completo...');
  
  // Paso 1 — cámara
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    msg('✓ Paso 1: Cámara OK', 'ok');
    stream.getTracks().forEach(t => t.stop());
  } catch(e) {
    msg('✗ Paso 1 FALLO: ' + e.name + ' — ' + e.message, 'err');
    return;
  }

  // Paso 2 — contenedor
  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;z-index:1;';
  document.body.appendChild(wrapper);
  msg('✓ Paso 2: Contenedor creado ' + wrapper.offsetWidth + 'x' + wrapper.offsetHeight, 'ok');

  // Paso 3 — MindAR
  try {
    msg('Iniciando MindARThree...');
    const mindarThree = new window.MINDAR.IMAGE.MindARThree({
      container: wrapper,
      imageTargetSrc: 'https://jcclimentcanto.github.io/la-forma-encontrada/targets.mind',
      maxTrack: 1,
      uiLoading: 'no',
      uiError: 'no',
      uiScanning: 'no'
    });
    msg('✓ Paso 3: MindARThree creado', 'ok');

    msg('Iniciando AR (puede tardar)...');
    await mindarThree.start();
    msg('✓ Paso 4: AR iniciado correctamente', 'ok');
    
    setTimeout(() => { mindarThree.stop(); wrapper.remove(); msg('AR detenido.'); }, 5000);
    
  } catch(e) {
    msg('✗ Paso 3/4 FALLO: ' + e.name + ' — ' + e.message, 'err');
    wrapper.remove();
  }
}
</script>
</body>
</html>
