<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AR Test</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; font-family:'Courier New',monospace; color:#fff; padding:20px; }
button { background:transparent; border:1px solid #C04828; color:#C04828; font-family:'Courier New',monospace; font-size:11px; padding:14px 20px; cursor:pointer; margin:8px 0; display:block; width:100%; }
#log { margin-top:20px; font-size:10px; line-height:2; color:#888; word-break:break-all; }
.ok { color:#4CAF50; } .err { color:#C04828; }
.sline { font-size:9px; margin:3px 0; color:#555; }
</style>
</head>
<body>

<div style="color:#C04828;font-size:12px;letter-spacing:3px;margin-bottom:4px;">AR DIAGNÓSTICO</div>
<div style="color:#333;font-size:9px;letter-spacing:2px;margin-bottom:16px;">v12 — dos targets</div>

<div class="sline" id="s-aframe">aframe: ...</div>
<div class="sline" id="s-mindar">mindar-aframe: ...</div>

<button onclick="testCamera()">1. PROBAR CÁMARA</button>
<button onclick="testLibs()">2. VERIFICAR LIBRERÍAS</button>
<button onclick="launchAR()">3. LANZAR AR</button>
<a href="index.html" style="color:#333;font-size:10px;letter-spacing:2px;display:block;margin-top:10px;">← VOLVER</a>

<div id="log"></div>

<!-- A-Frame desde CDN — es pequeño y fiable -->
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"
  onload="document.getElementById('s-aframe').textContent='aframe: ✓';document.getElementById('s-aframe').style.color='#4CAF50';"
  onerror="document.getElementById('s-aframe').textContent='aframe: ✗';document.getElementById('s-aframe').style.color='#C04828';"></script>
<script src="mindar-image-aframe.prod.js"
  onload="document.getElementById('s-mindar').textContent='mindar-aframe: ✓';document.getElementById('s-mindar').style.color='#4CAF50';"
  onerror="document.getElementById('s-mindar').textContent='mindar-aframe: ✗';document.getElementById('s-mindar').style.color='#C04828';"></script>

<script>
const log = document.getElementById('log');
function msg(text, type='') {
  const p = document.createElement('p');
  p.textContent = text; p.className = type;
  log.appendChild(p);
}

async function testCamera() {
  log.innerHTML = '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    msg('✓ Cámara OK', 'ok');
    const t = stream.getVideoTracks()[0];
    msg('Dispositivo: ' + t.label);
    stream.getTracks().forEach(t => t.stop());
  } catch(e) {
    msg('✗ ' + e.name + ': ' + e.message, 'err');
  }
}

function testLibs() {
  log.innerHTML = '';
  msg('AFRAME: ' + (typeof AFRAME !== 'undefined' ? '✓ ' + AFRAME.version : '✗'), typeof AFRAME !== 'undefined' ? 'ok' : 'err');
  msg('window.MINDAR: ' + typeof window.MINDAR);
  if (window.MINDAR) {
    msg('MINDAR keys: ' + Object.keys(window.MINDAR).join(', '), 'ok');
  }
  // Buscar el componente MindAR en A-Frame
  if (typeof AFRAME !== 'undefined') {
    const mindComponents = Object.keys(AFRAME.components || {}).filter(k => k.includes('mind') || k.includes('mindar'));
    msg('Componentes MindAR en AFRAME: ' + (mindComponents.join(', ') || 'ninguno'));
  }
}

function launchAR() {
  log.innerHTML = '';
  msg('Lanzando escena AR...');
  
  // Crear escena A-Frame con MindAR
  const scene = document.createElement('a-scene');
  scene.setAttribute('mindar-image', 'imageTargetSrc: targets.mind; autoStart: true;');
  scene.setAttribute('color-space', 'sRGB');
  scene.setAttribute('renderer', 'colorManagement: true;');
  scene.setAttribute('vr-mode-ui', 'enabled: false');
  scene.setAttribute('device-orientation-permission-ui', 'enabled: false');
  scene.style.cssText = 'position:fixed;inset:0;z-index:100;';

  const assets = document.createElement('a-assets');
  scene.appendChild(assets);

  const camera = document.createElement('a-camera');
  camera.setAttribute('position', '0 0 0');
  camera.setAttribute('look-controls', 'enabled: false');
  scene.appendChild(camera);

  // Target 0 — página 7
  const target0 = document.createElement('a-entity');
  target0.setAttribute('mindar-image-target', 'targetIndex: 0');
  const tri0 = document.createElement('a-entity');
  tri0.setAttribute('geometry', 'primitive: box');
  tri0.setAttribute('material', 'color: #C04828; wireframe: true');
  tri0.setAttribute('scale', '0.3 0.3 0.3');
  tri0.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 2000');
  target0.appendChild(tri0);
  scene.appendChild(target0);

  // Target 1 — página 33
  const target1 = document.createElement('a-entity');
  target1.setAttribute('mindar-image-target', 'targetIndex: 1');
  const tri1 = document.createElement('a-entity');
  tri1.setAttribute('geometry', 'primitive: box');
  tri1.setAttribute('material', 'color: #185FA5; wireframe: true');
  tri1.setAttribute('scale', '0.3 0.3 0.3');
  tri1.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 2000');
  target1.appendChild(tri1);
  scene.appendChild(target1);

  document.body.appendChild(scene);
  msg('✓ Escena lanzada — apunta a la página 7', 'ok');

  // Botón para cerrar
  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✕ CERRAR AR';
  closeBtn.style.cssText = 'position:fixed;top:20px;right:20px;z-index:9999;padding:10px;background:#000;border:1px solid #C04828;color:#C04828;font-family:monospace;';
  closeBtn.onclick = () => { scene.remove(); closeBtn.remove(); };
  document.body.appendChild(closeBtn);
}
</script>
</body>
</html>
