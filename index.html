  transition:all 0.3s;
}
.btn:hover { border-color:#C04828; color:#C04828; }
.btn:hover svg { opacity:1; }
.btn svg { opacity:0.5; transition:opacity 0.3s; }
.btn-ar { border-color:#185FA5; color:#185FA5; }
