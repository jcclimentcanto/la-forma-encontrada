<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Forma Encontrada — POLÍGONOS</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Courier New',monospace; }
canvas { position:fixed; inset:0; width:100%; height:100%; }
video { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
#ui { position:fixed; inset:0; pointer-events:none; }
.htitle { position:absolute; top:16px; left:20px; color:#C04828; font-size:11px; letter-spacing:3px; }
.hmode { position:absolute; top:33px; left:20px; color:#222; font-size:9px; letter-spacing:3px; }
#status { position:absolute; top:16px; right:160px; color:#333; font-size:9px; letter-spacing:2px; }
.back { position:absolute; top:14px; right:20px; pointer-events:all; background:transparent; border:0.5px solid #181816; color:#333; font-family:'Courier New',monospace; font-size:9px; letter-spacing:2px; padding:6px 14px; cursor:pointer; text-decoration:none; transition:all 0.3s; }
.back:hover { border-color:#C04828; color:#C04828; }
#legend { position:absolute; top:50%; right:20px; transform:translateY(-50%); display:flex; flex-direction:column; gap:12px; width:115px; }
.leg { display:flex; flex-direction:column; align-items:center; gap:3px; opacity:0.2; transition:opacity 0.3s; }
.leg.active { opacity:1; }
.leg svg { width:44px; height:44px; }
.ltxt { color:#666; font-size:7px; letter-spacing:1.5px; text-align:center; line-height:1.6; }
.lact { color:#C04828; font-size:7px; letter-spacing:1px; text-align:center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="video" autoplay playsinline muted></video>
<div id="ui">
  <div class="htitle">LA FORMA ENCONTRADA</div>
  <div class="hmode">POLÍGONOS</div>
  <div id="status"></div>
  <a class="back" href="index.html">← MENÚ</a>
  
  <div id="legend">
    <div class="leg active" id="leg-open">
      <svg viewBox="0 0 44 44" fill="none"><g stroke="#fff" stroke-width="1.3" stroke-linecap="round"><line x1="22" y1="38" x2="22" y2="8"/><line x1="17" y1="38" x2="17" y2="11"/><line x1="27" y1="38" x2="27" y2="11"/><line x1="12" y1="38" x2="12" y2="16"/><line x1="32" y1="38" x2="32" y2="16"/><path d="M9 38 Q22 42 35 38"/></g></svg>
      <div class="ltxt">MANO ABIERTA</div><div class="lact">EXPANDE</div>
    </div>
    <div class="leg" id="leg-fist">
      <svg viewBox="0 0 44 44" fill="none"><g stroke="#fff" stroke-width="1.3" stroke-linecap="round"><rect x="11" y="23" width="22" height="13" rx="4"/><rect x="13" y="16" width="18" height="9" rx="3"/><path d="M11 27 Q8 27 8 31 Q8 35 11 35"/></g></svg>
      <div class="ltxt">PUÑO CERRADO</div><div class="lact">CONTRAE</div>
    </div>
    <div class="leg" id="leg-pinch">
      <svg viewBox="0 0 44 44" fill="none"><g stroke="#fff" stroke-width="1.3" stroke-linecap="round"><circle cx="22" cy="22" r="5"/><line x1="17" y1="17" x2="10" y2="10"/><line x1="27" y1="17" x2="34" y2="10"/><line x1="27" y1="27" x2="34" y2="34"/><line x1="17" y1="27" x2="10" y2="34"/></g></svg>
      <div class="ltxt">PELLIZCO</div><div class="lact">RESET</div>
    </div>
    <div class="leg" id="leg-swipe">
      <svg viewBox="0 0 44 44" fill="none"><g stroke="#fff" stroke-width="1.3" stroke-linecap="round"><line x1="22" y1="36" x2="22" y2="12"/><line x1="17" y1="36" x2="17" y2="15"/><line x1="27" y1="36" x2="27" y2="15"/><path d="M14 36 Q22 40 30 36"/><line x1="4" y1="22" x2="40" y2="22" stroke-dasharray="3,2"/><polyline points="34,17 40,22 34,27"/></g></svg>
      <div class="ltxt">BARRIDO LATERAL</div><div class="lact">ONDULA</div>
    </div>
    <div class="leg" id="leg-hands2">
      <svg viewBox="0 0 44 44" fill="none"><g stroke="#fff" stroke-width="1.3" stroke-linecap="round"><line x1="4" y1="22" x2="40" y2="22"/><line x1="4" y1="17" x2="4" y2="27"/><line x1="40" y1="17" x2="40" y2="27"/><line x1="14" y1="16" x2="14" y2="10"/><line x1="19" y1="16" x2="19" y2="8"/><line x1="24" y1="16" x2="24" y2="10"/><path d="M11 28 Q19 32 27 28"/></g></svg>
      <div class="ltxt">DOS MANOS</div><div class="lact">DENSIDAD</div>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
let W, H, frame=0;
let mx, my, pmx, pmy, vhx=0, vhy=0;
let expandFactor=1.0, densityFactor=1.0;
let canvas, ctx;
let nodes=[], COLS=22, ROWS=16;
let swipeWave=[];

function leg(id,on){document.getElementById('leg-'+id)?.classList.toggle('active',on);}
function status(t){const el=document.getElementById('status');if(el)el.textContent=t;}

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  mx=W/2; my=H/2; pmx=W/2; pmy=H/2;
  buildGrid();
}

function buildGrid(){
  // Número de columnas/filas según densidad
  COLS = Math.round(18 * densityFactor + 4);
  ROWS = Math.round(12 * densityFactor + 4);
  nodes = [];
  for(let row=0; row<=ROWS; row++){
    for(let col=0; col<=COLS; col++){
      const bx = col * W / COLS;
      const by = row * H / ROWS;
      nodes.push({
        bx, by,       // posicion base
        x: bx, y: by, // posicion actual
        vx: 0, vy: 0,  // velocidad
        // Fase de respiracion — unica por nodo
        phase: Math.random() * Math.PI * 2,
        amp: 8 + Math.random() * 14
      });
    }
  }
  swipeWave = [];
}

function getNode(col, row){ return nodes[row*(COLS+1)+col]; }

function updateNodes(){
  const breathScale = expandFactor;
  const cx = W/2, cy = H/2;

  nodes.forEach((n, i) => {
    // Respiracion organica — cada nodo tiene su propia fase
    const breath = Math.sin(frame * 0.018 + n.phase) * n.amp * breathScale;
    const breathX = (n.bx - cx) / (W/2) * breath;
    const breathY = (n.by - cy) / (H/2) * breath;

    // Influencia de la mano — atraccion/repulsion local
    const dx = n.bx - mx, dy = n.by - my;
    const d = Math.sqrt(dx*dx + dy*dy) + 1;
    const influence = Math.max(0, 1 - d / (200 * breathScale));
    const handForce = influence * influence * 60 * breathScale;
    const hx = (dx/d) * handForce;
    const hy = (dy/d) * handForce;

    // Efecto ola de swipe
    let wx=0, wy=0;
    swipeWave.forEach(w => {
      const wdx = n.bx - w.x, wdy = n.by - w.y;
      const wd = Math.sqrt(wdx*wdx + wdy*wdy) + 1;
      const wInfluence = Math.max(0, 1 - wd/300) * w.strength * Math.sin(w.age * 0.15);
      wx += (vhx / (Math.abs(vhx)+1)) * wInfluence * 40;
      wy += wdy/wd * wInfluence * 10;
    });

    n.x = n.bx + breathX + hx + wx;
    n.y = n.by + breathY + hy + wy;
  });

  // Actualizar ondas de swipe
  swipeWave = swipeWave.filter(w => w.strength > 0.01);
  swipeWave.forEach(w => { w.strength *= 0.94; w.age++; });
}

function drawGrid(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  // Dibujar líneas horizontales
  for(let row=0; row<=ROWS; row++){
    ctx.beginPath();
    for(let col=0; col<=COLS; col++){
      const n = getNode(col, row);
      const alpha = 0.15 + (row/ROWS) * 0.25;
      if(col===0){
        ctx.strokeStyle=`rgba(255,255,255,${alpha})`;
        ctx.lineWidth=0.7;
        ctx.moveTo(n.x, n.y);
      } else {
        ctx.lineTo(n.x, n.y);
      }
    }
    ctx.stroke();
  }

  // Dibujar líneas verticales
  for(let col=0; col<=COLS; col++){
    ctx.beginPath();
    for(let row=0; row<=ROWS; row++){
      const n = getNode(col, row);
      const alpha = 0.15 + (col/COLS) * 0.25;
      if(row===0){
        ctx.strokeStyle=`rgba(255,255,255,${alpha})`;
        ctx.lineWidth=0.7;
        ctx.moveTo(n.x, n.y);
      } else {
        ctx.lineTo(n.x, n.y);
      }
    }
    ctx.stroke();
  }

  // Diagonales internas en algunas celdas
  ctx.strokeStyle='rgba(255,255,255,0.04)';
  ctx.lineWidth=0.5;
  for(let row=0; row<ROWS; row++){
    for(let col=0; col<COLS; col++){
      if((col+row)%3===0){
        const tl=getNode(col,row), br=getNode(col+1,row+1);
        ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(br.x,br.y);ctx.stroke();
      }
    }
  }

  // Punto sutil en la posición de la mano
  const handAlpha = Math.min(0.3, Math.sqrt(vhx*vhx+vhy*vhy)/20);
  if(handAlpha>0.02){
    ctx.beginPath();ctx.arc(mx,my,12,0,Math.PI*2);
    ctx.strokeStyle=`rgba(192,72,40,${handAlpha})`;ctx.lineWidth=1;ctx.stroke();
  }
}

function loop(){
  updateNodes();
  drawGrid();

  // Velocidad mano y swipe
  vhx=mx-pmx; vhy=my-pmy;
  const isSwipe=Math.abs(vhx)>8&&Math.abs(vhx)>Math.abs(vhy)*1.3;
  if(isSwipe){
    swipeWave.push({x:mx,y:my,strength:1.0,age:0});
    leg('swipe',true);
  } else {
    leg('swipe',false);
  }
  pmx=mx; pmy=my; frame++;
  requestAnimationFrame(loop);
}

function initEngine(){
  canvas=document.getElementById('c');
  ctx=canvas.getContext('2d');
  resize(); loop();
  window.addEventListener('resize',resize);
  canvas.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();mx=e.touches[0].clientX;my=e.touches[0].clientY;},{passive:false});
  document.addEventListener('keydown',e=>{
    if(e.key==='+'||e.key==='='){expandFactor=Math.min(2.0,expandFactor+.15);status('EXPANDIENDO');}
    if(e.key==='-'){expandFactor=Math.max(0.3,expandFactor-.15);status('CONTRAYENDO');}
    if(e.key==='r'||e.key==='R'){expandFactor=1.0;densityFactor=1.0;buildGrid();status('RESET');}
  });
  status('RATON ACTIVO — + / - / R');
  initCamera();
}
</script>
<script>
async function initCamera(){
  try {
    const video = document.getElementById('video');
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});
    video.srcObject = stream; await video.play();
    status('CARGANDO...');
    const hands = new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.75,minTrackingConfidence:0.6});
    hands.onResults(r=>{
      status('');
      if(r.multiHandLandmarks&&r.multiHandLandmarks.length>0){
        const lm=r.multiHandLandmarks[0];
        mx=(1-lm[9].x)*W; my=lm[9].y*H;
        applyGesture(detectGesture(lm));
        if(r.multiHandLandmarks.length>1){
          const lm2=r.multiHandLandmarks[1];
          const dx=lm[9].x-lm2[9].x,dy=lm[9].y-lm2[9].y;
          const nd=Math.max(0.3,Math.min(2.2,Math.sqrt(dx*dx+dy*dy)*4));
          if(Math.abs(nd-densityFactor)>.15){densityFactor=nd;buildGrid();status('DENSIDAD '+Math.round(nd*100)+'%');leg('hands2',true);}
          else leg('hands2',false);
        }
      } else { lastGesture=''; ['open','fist','pinch'].forEach(id=>leg(id,false)); }
    });
    const cam=new Camera(video,{onFrame:async()=>await hands.send({image:video}),width:640,height:480});
    cam.start(); status('GESTOS ACTIVOS');
  } catch(e){ status('MODO RATON'); }
}
function detectGesture(lm){
  const tips=[8,12,16,20],mids=[6,10,14,18];
  const ext=tips.map((t,i)=>lm[t].y<lm[mids[i]].y);
  const n=ext.filter(Boolean).length;
  const thumb=lm[4].x<lm[3].x;
  const pdx=lm[4].x-lm[8].x,pdy=lm[4].y-lm[8].y;
  if(Math.sqrt(pdx*pdx+pdy*pdy)<0.055)return'pinch';
  if(n===0&&!thumb)return'fist';
  if(n>=4)return'open';
  return'none';
}
let lastGesture='';
function applyGesture(g){
  ['open','fist','pinch'].forEach(id=>leg(id,false));
  if(g!=='none')leg(g,true);
  if(g===lastGesture)return; lastGesture=g;
  if(g==='open'){expandFactor=Math.min(2.0,expandFactor+.15);status('EXPANDIENDO');}
  else if(g==='fist'){expandFactor=Math.max(0.3,expandFactor-.15);status('CONTRAYENDO');}
  else if(g==='pinch'){expandFactor=1.0;densityFactor=1.0;buildGrid();status('RESET');}
}
</script>
<script>initEngine();</script>
</body>
</html>
